<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="180" viewBox="0 0 1120 180" role="img" aria-labelledby="title desc"><title id="title">A reference model for accountable work</title><desc id="desc">Context, authority, procedure and evidence. A conceptual explanation of Standing Orders, not an execution interface.</desc><rect width="1120" height="180" rx="20" fill="#101e27"/><g font-family="Arial, sans-serif"><g transform="translate(24 27)"><rect width="250" height="126" rx="12" fill="#19343b" stroke="#42656a"/><text x="18" y="29" fill="#e3b778" font-size="14" letter-spacing="2">01</text><text x="18" y="59" fill="#f4f0e7" font-size="25" font-weight="700">Context</text><text x="18" y="82" fill="#c6dedf" font-size="16">Understand the work</text></g><g transform="translate(298 27)"><rect width="250" height="126" rx="12" fill="#19343b" stroke="#42656a"/><text x="18" y="29" fill="#e3b778" font-size="14" letter-spacing="2">02</text><text x="18" y="59" fill="#f4f0e7" font-size="25" font-weight="700">Authority</text><text x="18" y="82" fill="#c6dedf" font-size="16">Know the boundary</text></g><g transform="translate(572 27)"><rect width="250" height="126" rx="12" fill="#19343b" stroke="#42656a"/><text x="18" y="29" fill="#e3b778" font-size="14" letter-spacing="2">03</text><text x="18" y="59" fill="#f4f0e7" font-size="25" font-weight="700">Procedure</text><text x="18" y="82" fill="#c6dedf" font-size="16">Follow the reference</text></g><g transform="translate(846 27)"><rect width="250" height="126" rx="12" fill="#19343b" stroke="#42656a"/><text x="18" y="29" fill="#e3b778" font-size="14" letter-spacing="2">04</text><text x="18" y="59" fill="#f4f0e7" font-size="25" font-weight="700">Evidence</text><text x="18" y="82" fill="#c6dedf" font-size="16">Show the result</text></g></g></svg>